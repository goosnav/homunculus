name: Test and build source download
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          for file in web/*.js; do node --check "$file"; done
      - name: Test browser simulation, mind bridge, room and comics
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Test game, saves and extracted source download
        run: python -m unittest discover -s tests -v
      - name: Upload source ZIP and checksum
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: Homunculus-source
          path: |
            dist/homunculus-*.zip
            dist/homunculus-*.zip.sha256
          if-no-files-found: error
      - name: Build and verify the standalone browser edition
        run: |
          npm run build
          npm run check:build
          npx wrangler deploy --dry-run
          python tools/package-browser.py
      - name: Verify real browser inference using only bundled assets
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        shell: bash
        run: |
          npx playwright-core install --with-deps chromium
          npm run preview -- --port 4173 > /tmp/homunculus-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Upload browser edition
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: Homunculus-browser
          path: |
            build/homunculus-browser.zip
            build/homunculus-browser.zip.sha256
          if-no-files-found: error
