name: Build native downloads
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.19.0 -r requirements-desktop.txt
      - run: python -m PyInstaller --noconfirm --name Homunculus --onedir --add-data "web:web" --hidden-import webview run.py
      - uses: actions/upload-artifact@v4
        with:
          name: Homunculus-${{ matrix.os }}
          path: dist/Homunculus
