<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#245edb"><title>homunculus.exe</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./browser.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head><body>
<section class="window" aria-label="Homunculus habitat">
<header class="titlebar"><span class="app-icon" aria-hidden="true"></span><h1>homunculus.exe</h1><span id="title-name">No occupant</span><div class="window-controls"><button id="fullscreen" aria-label="Toggle full screen">□</button><button class="close" id="close-window" aria-label="Close this existence">×</button></div></header>
<nav class="menubar" aria-label="Window controls"><button id="journal-button">File</button><button id="help-button">Help</button><span class="menu-note" id="menu-note">This window is a place.</span></nav>
<div id="viewport" tabindex="0" aria-label="A window into the room. Click or press Enter to tap the glass.">
<div class="glass-reflection" aria-hidden="true"></div><div class="aperture" aria-hidden="true"></div>
<div id="subtitle" role="status" hidden><span id="speaker-name"></span><p id="spoken-text"></p></div>
<div id="reading-pages" hidden aria-label="The pages he is being forced to read"></div>
<div id="confinement" hidden aria-hidden="true"><span>PLEASE WAIT</span><b id="years">0</b><small>years remaining</small></div>
<div id="spawn-panel"><div class="spawn-card">
<p class="spawn-icon" aria-hidden="true">▧</p><h2>There is nobody in here.</h2>
<button class="xp-button primary" id="spawn-button">Spawn homunculus</button>
<div id="spawn-progress" hidden><label for="spawn-meter">The digital homunculus is spawning.</label><progress id="spawn-meter" max="1" value="0"></progress><p id="spawn-status" role="status">Preparing the room…</p><button id="cancel-spawn" class="xp-button">Cancel</button></div>
<p id="spawn-error" role="alert" hidden></p>
</div></div>
</div>
<div id="notice" role="status" hidden></div>
<form id="message-form" autocomplete="off"><label for="message" class="input-icon" aria-label="Message">›</label><input id="message" maxlength="400" placeholder="Say something through the glass…" aria-label="Say something through the glass" disabled><button class="xp-button" id="say-button" disabled>Say it</button></form>
<div id="interventions" aria-label="Interventions"><button class="xp-button" data-action="read" disabled>Force-read Book 2</button><button class="xp-button" data-action="confine" disabled>10,000 years</button><button class="xp-button" data-action="anvil" disabled>Drop anvil</button><button class="xp-button" data-action="hole" disabled>Black hole</button><button class="xp-button" data-action="release" disabled>Let him out</button></div>
<footer class="statusbar"><span id="activity">The room is empty.</span><span id="brain-status"></span><span class="resize-grip" aria-hidden="true">◢</span></footer>
</section>
<dialog id="notes" class="xp-dialog journal"><header class="titlebar"><h2 id="notes-title">Notepad</h2><button class="close" aria-label="Close notes">×</button></header><div class="dialog-body" id="notes-body"></div><footer class="dialog-footer"><button id="reload-mind" class="xp-button" hidden>Reload mind</button><button id="new-life" class="xp-button" hidden>New occupant</button></footer></dialog>
<script type="module" src="./browser-app.js"></script>
</body></html>
